name: Dependabot auto-merge

# Public repo, so branch protection (main, requiring the "test" check
# from ci.yml) is actually available here - unlike tailfws, which is
# private on the free plan and has to chain off workflow_run instead.
# `gh pr merge --auto` here genuinely waits on that required check via
# GitHub's own gating, no workaround needed.
#
# All dependabot bumps, major included, merge unattended once CI passes.
# The one risk that's specific to major bumps and that CI didn't used to
# cover - tail-fweb's router being mounted into a host app on a
# different Express major than the one bundled here - is now covered by
# test/index.test.js's "different Express major version" host test. If
# a future major bump needs a human look (a genuinely new class of risk,
# not just "it's major"), that's a reason to add a test for it, not to
# reintroduce a blanket hold here.
#
# Branch protection's required-status-checks is set to non-strict
# (2026-07-19) after PR #18 stalled indefinitely: strict mode requires
# the check to have passed on a branch that's up to date with main, and
# nothing here automatically updates a Dependabot PR's branch when main
# moves ahead of it (Dependabot itself declined a manual "@dependabot
# rebase" here, replying the base commit hadn't changed, even though it
# had - had to force it via the update-branch API directly). Non-strict
# means a PR merges once CI has passed on whatever commit it last ran
# against, not necessarily the literal latest main - an acceptable
# trade-off for isolated dependency bumps merging in quick succession,
# and the one that matches this workflow's own "unattended once CI
# passes" intent instead of silently stalling on it.

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
