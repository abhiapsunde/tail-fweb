name: CI

# The actual gate the auto-merge workflow depends on. Runs on every PR
# (Dependabot's included) regardless of whether package.json itself
# changed - a pure lockfile bump wouldn't trigger publish.yml's
# path-filtered test run, so this needs to be unconditional.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung test previously ran to GitHub's 6h default job cap before
    # failing, blocking the auto-merge check with no useful signal in
    # the meantime. Fail fast instead.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
