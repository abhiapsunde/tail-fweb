name: Publish to npm

# Bumping the version in package.json and pushing to main IS the release
# action - no separate `npm publish` or git tag step needed. Skips
# entirely if the version already matches what's live on npm, so it's
# safe to just always run on every push to main.
#
# Uses npm Trusted Publishing (OIDC) - no NPM_TOKEN secret at all. Trust
# is established on npm's side (the package's Settings -> Trusted
# Publisher page), matching this exact repo + workflow filename. Requires
# npm CLI >= 11.5.1, hence the explicit upgrade step below; whatever
# version ships bundled with actions/setup-node's Node isn't guaranteed to
# be new enough. Provenance attestation is automatic, no --provenance flag
# needed.

on:
  push:
    branches: [main]
    paths:
      - 'package.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm CLI supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest

      - name: Compare local version to published version
        id: version-check
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo "none")
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          echo "Local: $LOCAL_VERSION / Published: $PUBLISHED_VERSION"

      - name: Install dependencies
        if: steps.version-check.outputs.local != steps.version-check.outputs.published
        run: npm ci

      - name: Run tests
        if: steps.version-check.outputs.local != steps.version-check.outputs.published
        run: npm test

      - name: Publish
        if: steps.version-check.outputs.local != steps.version-check.outputs.published
        run: npm publish
